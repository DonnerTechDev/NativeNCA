name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NativeNCA.slnx

      - name: Build
        run: dotnet build NativeNCA.slnx -c Release --no-restore

      # Tests that call the real НУЦ time-stamping service are skipped in CI.
      - name: Test
        run: dotnet test NativeNCA.Tests -c Release --no-build --filter "Category!=Network" --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  package:
    name: Package ${{ matrix.rid }}
    needs: build
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+.*)$') {
            $version = $Matches[1]
          } else {
            $version = "0.0.0-dev.$env:GITHUB_RUN_NUMBER"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish NativeNCA.App/NativeNCA.App.csproj
          -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.value }}
          -o publish/${{ matrix.rid }}

      - name: Archive
        shell: pwsh
        run: |
          $name = "NativeNCA-${{ steps.version.outputs.value }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath $name
          (Get-FileHash $name -Algorithm SHA256).Hash.ToLower() + "  $name" | Out-File "$name.sha256" -Encoding ascii

      # The updater installs only zips signed with the release key (version and architecture included).
      # The private key is the RELEASE_SIGNING_KEY secret; see tools/ReleaseSigning.
      - name: Sign
        shell: pwsh
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          $name = "NativeNCA-${{ steps.version.outputs.value }}-${{ matrix.rid }}.zip"
          if (-not $env:RELEASE_SIGNING_KEY) {
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              Write-Error "RELEASE_SIGNING_KEY is not set: a release without signatures cannot be installed by the updater"
              exit 1
            }
            Write-Host "RELEASE_SIGNING_KEY is not set; this untagged build is not signed"
            exit 0
          }
          dotnet run --project tools/ReleaseSigning -c Release -- sign $name "${{ steps.version.outputs.value }}" "${{ matrix.rid }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: NativeNCA-${{ matrix.rid }}
          path: NativeNCA-*.zip*

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: NativeNCA-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: NativeNCA-*.zip*
          generate_release_notes: true
          # Tags like v1.0.0-beta.1 are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
